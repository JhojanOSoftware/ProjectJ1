[tool.poetry]
name = "actividad-microsite-api"
version = "2.0.0"
description = "API for managing tenants and utility billing"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{include = "models"}, {include = "routes"}, {include = "services"}, {include = "utils"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.8"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pymysql = "^1.1.1"
python-dotenv = "^1.0.1"
pydantic = "^2.11.2"
pydantic-settings = "^2.8.1"
slowapi = "^0.1.9"
reportlab = "^4.2.5"
requests = "^2.32.3"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"
pytest-cov = "^6.0.0"
black = "^24.10.0"
isort = "^5.12.0"
pylint = "^3.3.3"
mypy = "^1.14.1"
flake8 = "^7.1.1"
httpx = "^0.28.1"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
